services:
  - type: web
    name: xe-vision-api
    runtime: python
    rootDir: vision
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: VISION_API_TOKEN
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: ENABLE_FACE_GROUPING
        value: "false"
      - key: FACE_MODEL_COMMERCIAL_LICENSE_CONFIRMED
        value: "false"
  - type: worker
    name: xe-vision-worker
    runtime: python
    rootDir: vision
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: ENABLE_FACE_GROUPING
        value: "false"
      - key: FACE_MODEL_COMMERCIAL_LICENSE_CONFIRMED
        value: "false"
